# Bump the home-manager flake inputs (config/home-manager/flake.lock) daily
# and open a PR with the result. No PR is opened when nothing changed.
name: Update flake lock

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Update flake inputs
        run: nix flake update --flake ./config/home-manager

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/flake-lock
          delete-branch: true
          commit-message: "flake.lock: update inputs"
          title: "flake.lock: update inputs"
          body: Automated daily `nix flake update` for `config/home-manager`.
