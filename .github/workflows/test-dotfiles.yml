# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master]
  pull_request:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
        with:
          submodules: true
      - run: cp -r $GITHUB_WORKSPACE ~
      - name: Setup Python
        uses: actions/setup-python@v2.2.2
      - name: Setup Node.js
        uses: actions/setup-node@v2.1.5
      - name: Setup Fish
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fish
      - name: Make install script executeable
        run: chmod +x install
      - name: Run install-dotfiles
        run: ./install

  # Boot the shared dev tools (config/home-manager/dev-tools.nix) in a real
  # NixOS VM. DeterminateSystems/nix-installer-action's `kvm` input wires up
  # /dev/kvm for NixOS test support when the runner exposes it (it also sets
  # DETERMINATE_NIX_KVM=0/1); without it qemu falls back to TCG, slower but
  # still correct.
  nix-vm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          kvm: true
      - name: KVM availability
        run: echo "DETERMINATE_NIX_KVM=${DETERMINATE_NIX_KVM:-0}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run NixOS VM test
        run: nix build ./config/home-manager#checks.x86_64-linux.vm -L
