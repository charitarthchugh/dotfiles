# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json

source: ~/.config/skillshare/skills

mode: merge

targets:
  antigravity:
    skills:
      path: ~/.gemini/antigravity/global_skills
  claude:
    skills:
      path: ~/.claude/skills
  cline:
    skills:
      path: ~/.cline/skills
  codex:
    skills:
      path: ~/.codex/skills
  copilot:
    skills:
      path: ~/.copilot/skills
  cursor:
    skills:
      path: ~/.cursor/skills
  gemini:
    skills:
      path: ~/.gemini/skills
  junie:
    skills:
      path: ~/.junie/skills
  opencode:
    skills:
      path: ~/.config/opencode/skills

ignore:
  - '**/.DS_Store'
  - '**/.git/**'

audit:
  block_threshold: CRITICAL
